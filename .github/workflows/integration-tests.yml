name: Integration Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  integration_node:
    name: node.js
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Print node version
        run: node -v

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Check built ESM with Node
        run: node --input-type=module -e "import('./dist/ESM/mailgun.node.js').then(m => console.log('ESM default export:', typeof m.default))"

      - name: Trace ts-jest
        run: TS_JEST_LOG=stderr:debug npm run test:integration:node -- --no-cache --runInBand

      # - name: Run Node.js related integration tests
      #   run:  npm run test:integration:node -- --no-cache

  integration_browser:
    name: browser
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Copy dist for test server
        run: cp -R ${{github.workspace}}/dist/* ${{github.workspace}}/tests/integration/browser/server/dist/

      - name: Show folder for test server
        run: ls -la ${{github.workspace}}/tests/integration/browser/server/dist/

      - name: Serve Files
        uses: Eun/http-server-action@v1
        with:
          directory: ${{ github.workspace}}/tests/integration/browser/server/
          port: 3000
          no-cache: false
          allowed-methods: |
            ["GET", "HEAD", "POST"]
          log: "log.txt"
          logTime: "false"

      - run: curl -vvvv http://localhost:3000/pages/AMD.html && cat log.txt
      - run: curl -vvvv http://localhost:3000/pages/ESM.html && cat log.txt
      - run: curl -vvvv http://localhost:3000/pages/ESM-dynamic.html && cat log.txt

      - name: Run Browser integration tests
        run: npm run test:integration:browser
